# 草稿：仅用于 HTTP 连通性验证，不是生产入口。
# 目标路径：/etc/nginx/sites-available/mmw-review-system
#
# 使用默认 server（server_name _），因此不需要把生产 IP 写进被 Git 跟踪的文件。
# 审核服务只监听 127.0.0.1:4325；4325 不应在安全组放行。

# 不记录查询串：OAuth 回调的 code/state 位于 query string。
log_format mmw_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status '
                       '$body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/mmw-access.log mmw_noquery;
    # nginx 错误日志可能含完整请求行；应用诊断使用 systemd journal。
    error_log /dev/null;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 200 "HTTP 连通性检查通过；审核应用仅通过 HTTPS 开放。\n";
    }
}
