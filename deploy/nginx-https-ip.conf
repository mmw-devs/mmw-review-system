# 生产 HTTPS 配置（Let's Encrypt IP 证书）。
# 目标路径：/etc/nginx/sites-available/mmw-review-system
#
# 证书目录固定为 /etc/letsencrypt/live/mmw-review/，因此本文件不需要写生产 IP。
# 80 仅用于 ACME 和跳转；443 反代到 127.0.0.1:4325。
# 启用前请先禁用 /etc/nginx/sites-enabled/default，避免 default_server 冲突。

# 不记录查询串：OAuth 回调的 code/state 位于 query string。
log_format mmw_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status '
                       '$body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/mmw-access.log mmw_noquery;
    # nginx 错误日志可能含完整请求行；应用诊断使用 systemd journal。
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mmw-review/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmw-review/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 暂不启用 HSTS：证书为 6 天短周期，先观察自动续期稳定性。

    access_log /var/log/nginx/mmw-access.log mmw_noquery;
    # nginx 错误日志可能含完整请求行；应用诊断使用 systemd journal。
    error_log /dev/null;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
