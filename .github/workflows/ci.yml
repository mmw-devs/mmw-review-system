name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: 离线测试
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 转换器与审核服务测试
        run: npm test
      - name: 证书与告警脚本离线测试
        run: python3 tests/deployment.test.py
  browser:
    name: 浏览器回归
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 检查浏览器并验证页面
        env:
          REVIEW_BROWSER: /usr/bin/google-chrome
        run: |
          test -x "$REVIEW_BROWSER" || { echo '运行环境缺少浏览器'; exit 1; }
          node --version
          "$REVIEW_BROWSER" --version
          node tests/review-browser.ts
      - name: 保存模拟页面截图
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-screenshots
          path: |
            data/ui-check/review-desktop.png
            data/ui-check/review-mobile.png
            data/ui-check/review-failure.png
          retention-days: 7
          if-no-files-found: warn
  result:
    name: CI 检查结果
    needs: [offline, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 确认全部必需检查成功
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$OFFLINE_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo '必需检查未全部成功，禁止放行'
            exit 1
          fi
          echo '全部必需检查成功'
